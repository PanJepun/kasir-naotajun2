<!DOCTYPE html>
<html>
<head>
  <title>Kasir Naotajun2</title>
  <meta charset="UTF-8">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    input, button, select { padding: 8px; margin: 5px; }
    #roleBadge { background:#007bff; color:white; padding:4px 8px; border-radius:4px; }
    .section { border: 1px solid #ddd; padding: 15px; margin-top: 15px; border-radius: 8px; }
  </style>
</head>
<body>

<div id="loginPage">
  <h2>Login Kasir Naotajun2</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<div id="appPage" style="display:none;">
  <h2>Kasir Naotajun2</h2>
  <span id="roleBadge">ROLE</span>
  <span id="userEmail"></span>
  <button onclick="logout()">Logout</button>

  <div class="section">
    <h3>1. Manajemen Meja & Check-in</h3>

    <!-- Bagian ini hanya muncul untuk admin -->
    <div id="tambahMejaSection">
      <h4>Tambah Meja</h4>
      <input type="text" id="namaMeja" placeholder="Nama Meja, contoh: Meja 5">
      <button onclick="tambahMeja()">Tambah Meja</button>
    </div>

    <h4>Check-in Meja</h4>
    <select id="pilihMeja">
      <option>Pilih Meja</option>
    </select>
    <input type="text" id="kunciReservasi" placeholder="Masukkan Kunci Reservasi">
    <button onclick="checkinMeja()">Check-in Meja</button>
  </div>

  <div class="section">
    <h3>2. Input Order</h3>
    <p>Bagian order kamu taruh di sini</p>
  </div>
</div>

<script>
// 1. Config Firebase kamu
const firebaseConfig = {
  apiKey: "AIzaSyA94bWbZJA0peV6rDg-vaHac1Ghn9t2ZW4",
  authDomain: "kasir-naotajun2.firebaseapp.com",
  databaseURL: "https://kasir-naotajun2-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kasir-naotajun2",
  storageBucket: "kasir-naotajun2.firebasestorage.app",
  messagingSenderId: "346309315110",
  appId: "1:346309315110:web:1bc443785229fa7a0b74e7"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// 2. Fungsi Login
function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  
  auth.signInWithEmailAndPassword(email, password)
    .catch(err => alert("Login gagal: " + err.message));
}

// 3. Fungsi Logout
function logout() {
  auth.signOut();
}

// 4. Cek status login dan role
auth.onAuthStateChanged(async (user) => {
  if (user) {
    const snap = await db.ref('users/' + user.uid).once('value');
    const userData = snap.val();
    
    if (!userData) {
      alert("Data user tidak ditemukan di database!");
      auth.signOut();
      return;
    }

    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('appPage').style.display = 'block';
    document.getElementById('userEmail').innerText = userData.email;
    document.getElementById('roleBadge').innerText = userData.role.toUpperCase();

    // Sembunyikan menu admin kalau bukan admin
    if (userData.role !== 'admin') {
      document.getElementById('tambahMejaSection').style.display = 'none';
    }

  } else {
    document.getElementById('loginPage').style.display = 'block';
    document.getElementById('appPage').style.display = 'none';
  }
});

// 5. Contoh fungsi tambah meja
function tambahMeja() {
  const nama = document.getElementById('namaMeja').value;
  if (!nama) return alert("Isi nama meja dulu");
  
  db.ref('meja').push({
    nama: nama,
    status: 'kosong',
    dibuatOleh: auth.currentUser.email
  });
  alert("Meja berhasil ditambah");
  document.getElementById('namaMeja').value = '';
}

function checkinMeja() {
  alert("Fungsi checkin belum diisi");
}
</script>

</body>
</html>
