<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir Naotajun</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 500px;
      margin: auto;
    }
    label, select, input, button {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      background: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover {
      background: #45a049;
    }
  </style>
</head>
<body>
  <h2>Check-in Meja</h2>
  
  <div>
    <label for="mejaSelect">Pilih Meja</label>
    <select id="mejaSelect">
      <option value="">-- Pilih Meja --</option>
    </select>

    <label for="reservationKey">Kunci Reservasi</label>
    <input type="text" id="reservationKey" placeholder="Masukkan kunci reservasi">

    <button id="btnCheckIn">Check-in Meja</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // GANTI INI DENGAN CONFIG FIREBASE KAMU
    const firebaseConfig = {
      apiKey: "MASUKKAN_API_KEY",
      authDomain: "MASUKKAN_AUTH_DOMAIN",
      projectId: "MASUKKAN_PROJECT_ID",
      storageBucket: "MASUKKAN_STORAGE_BUCKET",
      messagingSenderId: "MASUKKAN_SENDER_ID",
      appId: "MASUKKAN_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Load daftar meja ke dropdown pas halaman dibuka
    async function loadMeja() {
      const querySnapshot = await getDocs(collection(db, "tables"));
      const select = document.getElementById("mejaSelect");
      
      querySnapshot.forEach((doc) => {
        const option = document.createElement("option");
        option.value = doc.id;
        option.textContent = doc.data().name || doc.id;
        select.appendChild(option);
      });
    }
    loadMeja();

    // Fungsi check-in
    async function checkIn() {
      const meja = document.getElementById("mejaSelect").value;
      const key = document.getElementById("reservationKey").value;

      if (!meja || !key) {
        alert("Pilih meja dan isi kunci reservasi!");
        return;
      }

      try {
        const mejaRef = doc(db, "tables", meja);
        const mejaSnap = await getDoc(mejaRef);

        if (!mejaSnap.exists()) {
          alert("Meja tidak ditemukan!");
          return;
        }

        const data = mejaSnap.data();

        if (data.reservationKey !== key) {
          alert("Kunci reservasi salah!");
          return;
        }

        if (data.checked_in === true) {
          alert("Meja sudah check-in!");
          return;
        }

        await updateDoc(mejaRef, { checked_in: true });
        alert("Check-in berhasil!");

      } catch (error) {
        console.error("Error:", error);
        alert("Gagal check-in: " + error.message);
      }
    }

    // Bind tombol ke fungsi checkIn
    document.getElementById("btnCheckIn").addEventListener("click", checkIn);
  </script>
</body>
</html>
