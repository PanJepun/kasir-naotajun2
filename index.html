<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir Naotajun - Check-in Meja</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      padding: 20px; 
      max-width: 900px;
      margin: auto;
    }
    h2 { text-align: center; color: #333; }
    table { 
      width: 100%; 
      border-collapse: collapse; 
      margin-top: 20px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    th, td { 
      border: 1px solid #ddd; 
      padding: 12px; 
      text-align: left; 
    }
    th { 
      background: #4CAF50; 
      color: white; 
      font-weight: bold;
    }
    tr:nth-child(even) { background: #f9f9f9; }
    input { 
      width: 95%; 
      padding: 8px; 
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button { 
      padding: 8px 16px; 
      background: #4CAF50; 
      color: white; 
      border: none; 
      border-radius: 4px;
      cursor: pointer; 
      font-size: 14px;
    }
    button:hover { background: #45a049; }
    button:disabled { 
      background: #ccc; 
      cursor: not-allowed; 
    }
    .status { 
      font-weight: bold; 
      text-align: center;
    }
    .checked { color: green; }
    .not-checked { color: red; }
  </style>
</head>
<body>
  <h2>Daftar Meja - Check-in</h2>
  
  <table id="tabelMeja">
    <thead>
      <tr>
        <th width="20%">Meja</th>
        <th width="25%">Status</th>
        <th width="35%">Kunci Reservasi</th>
        <th width="20%">Aksi</th>
      </tr>
    </thead>
    <tbody>
      <!-- Data otomatis masuk dari Firebase -->
    </tbody>
  </table>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // GANTI DENGAN CONFIG FIREBASE KAMU
    const firebaseConfig = {
      apiKey: "MASUKKAN_API_KEY",
      authDomain: "MASUKKAN_AUTH_DOMAIN",
      projectId: "MASUKKAN_PROJECT_ID",
      storageBucket: "MASUKKAN_STORAGE_BUCKET",
      messagingSenderId: "MASUKKAN_SENDER_ID",
      appId: "MASUKKAN_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Load semua meja ke tabel
    async function loadTabelMeja() {
      try {
        console.log("Loading data meja...");
        const querySnapshot = await getDocs(collection(db, "tables"));
        const tbody = document.querySelector("#tabelMeja tbody");
        tbody.innerHTML = "";

        if (querySnapshot.size === 0) {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">Belum ada data meja</td></tr>`;
          return;
        }

        querySnapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const id = docSnap.id;
          const checked = data.checked_in === true;
          
          const row = `
            <tr>
              <td><strong>${data.name || id}</strong></td>
              <td class="status ${checked ? 'checked' : 'not-checked'}">
                ${checked ? '✓ Sudah Check-in' : '✗ Belum Check-in'}
              </td>
              <td>
                <input type="text" id="key-${id}" placeholder="Masukkan kunci" ${checked ? 'disabled' : ''}>
              </td>
              <td>
                <button onclick="checkInMeja('${id}')" ${checked ? 'disabled' : ''}>
                  Check-in
                </button>
              </td>
            </tr>
          `;
          tbody.innerHTML += row;
        });

        console.log("Selesai load", querySnapshot.size, "meja");

      } catch (error) {
        console.error("Gagal load tabel:", error);
        alert("Gagal load data meja: " + error.message);
      }
    }

    // Fungsi check-in
    window.checkInMeja = async function(mejaId) {
      const keyInput = document.getElementById(`key-${mejaId}`);
      const key = keyInput.value.trim();

      if (!key) {
        alert("Isi kunci reservasi dulu!");
        return;
      }

      try {
        const mejaRef = doc(db, "tables", mejaId);
        const mejaSnap = await getDoc(mejaRef);

        if (!mejaSnap.exists()) {
          alert("Meja tidak ditemukan!");
          return;
        }

        const data = mejaSnap.data();
        if (data.reservationKey !== key) {
          alert("Kunci reservasi salah!");
          return;
        }

        if (data.checked_in === true) {
          alert("Meja sudah check-in!");
          return;
        }

        await updateDoc(mejaRef, { checked_in: true });
        alert("Check-in berhasil!");
        loadTabelMeja(); // refresh tabel

      } catch (error) {
        console.error("Error check-in:", error);
        alert("Gagal check-in: " + error.message);
      }
    }

    // Jalankan saat halaman dibuka
    loadTabelMeja();
  </script>
</body>
</html>
