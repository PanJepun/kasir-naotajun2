<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir Naotajun</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: #4CAF50; color: white; }
    .btn-edit, .btn-del, .btn-save { 
      padding: 5px 10px; margin: 2px; border: none; cursor: pointer; border-radius: 4px; 
    }
    .btn-edit { background: #2196F3; color: white; }
    .btn-del { background: #f44336; color: white; }
    .btn-save { background: #4CAF50; color: white; }
    input[type="text"] { padding: 5px; width: 90%; }
  </style>
</head>
<body>
  <h2>Daftar Meja</h2>
  <table id="tabelMeja">
    <thead>
      <tr>
        <th>Meja</th>
        <th>Status</th>
        <th>Waktu Check-in</th>
        <th>Aksi</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT.firebaseio.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const tbody = document.querySelector("#tabelMeja tbody");

    onValue(ref(db, "meja"), (snapshot) => {
      tbody.innerHTML = "";
      snapshot.forEach((child) => {
        const data = child.val();
        const tr = document.createElement("tr");
        tr.id = "meja-" + data.id;

        if (data.editMode) {
          tr.innerHTML = `
            <td><input type="text" id="edit-nama-${data.id}" value="${data.nama || ''}"></td>
            <td>
              <button class="btn-save" onclick="simpanEditMeja('${data.id}')">Simpan</button>
              <button class="btn-del" onclick="batalEditMeja()">Batal</button>
            </td>
          `;
        } else {
          tr.innerHTML = `
            <td><b>${data.nama || data.id}</b> 
              <button class="btn-edit" style="padding:2px 6px;font-size:12px;" onclick="editMeja('${data.id}')">Edit</button>
            </td>
            <td>
              ${data.status === "checked-in" ? "✓ Sudah Check-in" : "✗ Belum Check-in"}
              ${data.namaPemesan ? `<br><small><b>Pemesan:</b> ${data.namaPemesan}</small>` : ""}
            </td>
            <td>${data.waktuCheckin || "-"}</td>
            <td>
              <button class="btn-del" onclick="hapusMeja('${data.id}')">Hapus</button>
            </td>
          `;
        }

        tbody.appendChild(tr);
      });
    });

    window.editMeja = (id) => {
      update(ref(db, "meja/" + id), { editMode: true });
    };

    window.batalEditMeja = () => {
      onValue(ref(db, "meja"), (snapshot) => {
        snapshot.forEach((child) => {
          update(ref(db, "meja/" + child.key), { editMode: false });
        });
      });
    };

    window.simpanEditMeja = (id) => {
      const namaBaru = document.getElementById("edit-nama-" + id).value;
      update(ref(db, "meja/" + id), { nama: namaBaru, editMode: false });
    };

    window.hapusMeja = (id) => {
      if (confirm("Yakin hapus meja ini?")) {
        set(ref(db, "meja/" + id), null);
      }
    };
  </script>
</body>
</html>
