<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir Naotajun</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #fff0f5; }
.section {
      background: white; padding: 15px; margin-bottom: 20px; border-radius: 8px;
      box-shadow: 0 2px 6px rgba(255,105,180,0.2); overflow-x: auto;
      border: 1px solid #ffb6c1;
    }
    input, select {
      padding: 8px; margin: 5px; border: 1px solid #ffb6c1; border-radius: 4px;
    }
    input:focus, select:focus {
      outline: none; border-color: #ff69b4; box-shadow: 0 0 5px #ffb6c1;
    }
    input:disabled, select:disabled, button:disabled {
      background: #f5f5f5; cursor: not-allowed; opacity: 0.6;
    }
    button {
      padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; margin: 2px;
      font-weight: bold;
    }
.btn-tambah { background: #ff69b4; color: white; }
.btn-tambah:hover:not(:disabled) { background: #ff1493; }
.btn-edit { background: #ff85c1; color: white; }
.btn-edit:hover:not(:disabled) { background: #ff69b4; }
.btn-del { background: #ff4d6d; color: white; }
.btn-del:hover:not(:disabled) { background: #e63946; }
.btn-print { background: #ff9ebc; color: white; }
.btn-print:hover:not(:disabled) { background: #ff69b4; }
    table { width: 100%; border-collapse: collapse; table-layout: auto; }
    th, td { border: 1px solid #ffb6c1; padding: 10px; text-align: left; white-space: nowrap; }
    th { background: #ff69b4; color: white; }
    h2, h3 { color: #d63384; }
.order-list { font-size: 13px; background: #fff0f5; padding: 8px; border-radius: 6px; margin-top: 5px; }
.order-list li { margin: 3px 0; }
.info-text { color: #d63384; font-size: 13px; margin-top: 8px; }

   /* CSS untuk bill/struk */
.bill {
      width: 280px; margin: 20px auto; padding: 10px; background: white;
      border: 1px solid #000; font-family: 'Courier New', monospace; font-size: 12px;
    }
.bill h3,.bill p { text-align: center; margin: 4px 0; }
.bill table { width: 100%; border-collapse: collapse; font-size: 12px; }
.bill th,.bill td { border: none; padding: 3px 2px; }
.bill.line { border-top: 1px dashed #000; margin: 6px 0; }

    @media print {
      body * { visibility: hidden; }
 .bill,.bill * { visibility: visible; }
 .bill { position: absolute; left: 0; top: 0; width: 100%; border: none; margin: 0; padding: 0; }
    }
  </style>
</head>
<body>
  <h2>💖 Kasir Naotajun 💖</h2>

  <div class="section">
    <h3>Tambah Meja</h3>
    <input type="text" id="inputNamaMeja" placeholder="meja 13">
    <button class="btn-tambah" onclick="tambahMeja()">Tambah</button>
  </div>

  <div class="section">
    <h3>Daftar Menu</h3>
    <input type="text" id="inputNamaMenu" placeholder="Nama menu">
    <input type="number" id="inputHargaMenu" placeholder="Harga">
    <button class="btn-tambah" onclick="tambahMenu()">Tambah Menu</button>
    <table id="tabelMenu">
      <thead><tr><th>Menu</th><th>Harga</th><th>Aksi</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="section">
    <h3>Buat Pesanan</h3>
    <select id="selectMeja" onchange="updateFormStatus()"></select>
    <select id="selectMenu" disabled></select>
    <input type="number" id="inputQty" value="1" min="1" style="width:60px;" disabled>
    <input type="text" id="inputPemesan" placeholder="Nama pemesan" disabled>
    <input type="text" id="inputWaitress" placeholder="Nama waitress" disabled>
    <button class="btn-tambah" id="btnTambahPesanan" onclick="tambahPesanan()" disabled>Tambah ke Pesanan</button>
    <div id="listPesanan"></div>
    <button class="btn-print" id="btnPrintBill" onclick="printBill()" disabled>Print Bill</button>
    <p class="info-text" id="infoText">Pilih meja yang sudah Check-in dulu</p>
  </div>

  <div class="section">
    <h3>Daftar Meja</h3>
    <table id="tabelMeja">
      <thead><tr><th>Meja</th><th>Status</th><th>Pesanan Aktif</th><th>Aksi</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="section">
    <h3>Riwayat Pesanan</h3>
    <button class="btn-edit" onclick="loadPesanan()">Refresh Pesanan</button>
    <table id="tabelPesanan">
      <thead><tr><th>Waktu</th><th>Meja</th><th>Pemesan</th><th>Waitress</th><th>Grand Total</th><th>Aksi</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="billArea"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue, set, update, push, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA94bWbZJA0PeV6rDg-vaHac1Ghn9t2ZW4",
      authDomain: "kasir-naotajun2.firebaseapp.com",
      databaseURL: "https://kasir-naotajun2-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "kasir-naotajun2",
      storageBucket: "kasir-naotajun2.firebasestorage.app",
      messagingSenderId: "346309315110",
      appId: "1:346309315110:web:1bc443785229fa7a0b74e7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const PPN_RATE = 0.11;
    const TAX_RATE = 0.10;

    let menuList = {};
    let pesananSement = {};
    let pesananAktif = {};

    onValue(ref(db, "pesanan_aktif"), (snapshot) => {
      pesananAktif = snapshot.val() || {};
      loadMeja();
    });

    function loadMeja() {
      onValue(ref(db, "meja"), (snapshot) => {
        const tbody = document.querySelector("#tabelMeja tbody");
        const selectMeja = document.querySelector("#selectMeja");
        tbody.innerHTML = "";
        selectMeja.innerHTML = "<option value=''>Pilih Meja</option>";

        snapshot.forEach((child) => {
          const data = child.val();
          const id = data.id;
          const pesanan = pesananAktif[id];

          let aksiBtn = "";
          let pesananHTML = "-";

          if (data.status === "checked-in" && pesanan && pesanan.items && pesanan.items.length > 0) {
            aksiBtn = `<button class="btn-edit" onclick="checkOutMeja('${id}')">Check-out</button>
                       <button class="btn-del" onclick="hapusMeja('${id}')">Hapus</button>`;

            const total = pesanan.grandTotal || 0;
            pesananHTML = `
              <div class="order-list">
                <b>${pesanan.pemesan || '-'}</b> | Waitress: ${pesanan.waitress || '-'}<br>
                <ul style="margin:5px 0; padding-left:18px;">
                  ${pesanan.items.map(i => `<li>${i.nama} x${i.qty} = Rp ${(i.subtotal || 0).toLocaleString()}</li>`).join("")}
                </ul>
                <b>Grand Total: Rp ${total.toLocaleString()}</b>
              </div>
            `;
          } else if (data.status === "checked-in") {
            aksiBtn = `<button class="btn-edit" onclick="checkOutMeja('${id}')">Check-out</button>
                       <button class="btn-del" onclick="hapusMeja('${id}')">Hapus</button>`;
            pesananHTML = "<div class='order-list'>Belum ada pesanan</div>";
          } else {
            aksiBtn = `<button class="btn-tambah" onclick="checkInMeja('${id}')">Check-in</button>
                       <button class="btn-del" onclick="hapusMeja('${id}')">Hapus</button>`;
          }

          tbody.innerHTML += `
            <tr>
              <td><b>${data.nama}</b></td>
              <td>${data.status === "checked-in"? "✓ Check-in" : "✗ Kosong"}</td>
              <td>${pesananHTML}</td>
              <td>${aksiBtn}</td>
            </tr>`;

          selectMeja.innerHTML += `<option value="${id}">${data.nama}</option>`;
        });

        updateFormStatus();
      });
    }

    function updateFormStatus() {
      const selectMeja = document.getElementById("selectMeja");
      const mejaId = selectMeja.value;
      const isCheckedIn = mejaId && mejaId!== "" && pesananAktif[mejaId];

      document.getElementById("selectMenu").disabled =!isCheckedIn;
      document.getElementById("inputQty").disabled =!isCheckedIn;
      document.getElementById("inputPemesan").disabled =!isCheckedIn;
      document.getElementById("inputWaitress").disabled =!isCheckedIn;
      document.getElementById("btnTambahPesanan").disabled =!isCheckedIn;
      document.getElementById("btnPrintBill").disabled =!isCheckedIn;

      document.getElementById("infoText").textContent = isCheckedIn
      ? "Meja sudah Check-in. Silakan isi pesanan."
        : "Pilih meja yang sudah Check-in dulu";

      if (isCheckedIn && pesananAktif[mejaId]) {
        document.getElementById("inputPemesan").value = pesananAktif[mejaId].pemesan || "";
        document.getElementById("inputWaitress").value = pesananAktif[mejaId].waitress || "";
      }
    }

    onValue(ref(db, "menu"), (snapshot) => {
      const tbody = document.querySelector("#tabelMenu tbody");
      const selectMenu = document.querySelector("#selectMenu");
      tbody.innerHTML = "";
      selectMenu.innerHTML = "<option value=''>Pilih Menu</option>";
      menuList = {};

      snapshot.forEach((child) => {
        const data = child.val();
        menuList[data.id] = data;
        tbody.innerHTML += `
          <tr>
            <td>${data.nama}</td>
            <td>Rp ${data.harga.toLocaleString()}</td>
            <td><button class="btn-del" onclick="hapusMenu('${data.id}')">Hapus</button></td>
          </tr>`;
        selectMenu.innerHTML += `<option value="${data.id}">${data.nama} - Rp ${data.harga.toLocaleString()}</option>`;
      });
    });

    window.loadPesanan = () => {
      onValue(ref(db, "pesanan"), (snapshot) => {
        const tbody = document.querySelector("#tabelPesanan tbody");
        tbody.innerHTML = "";
        if (!snapshot.exists()) {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Belum ada pesanan</td></tr>`;
          return;
        }
        snapshot.forEach((child) => {
          const data = child.val();
          const key = child.key;
          tbody.innerHTML += `
            <tr>
              <td>${data.waktu}</td>
              <td>${data.mejaId}</td>
              <td>${data.pemesan}</td>
              <td>${data.waitress || '-'}</td>
              <td>Rp ${(data.grandTotal || 0).toLocaleString()}</td>
              <td><button class="btn-del" onclick="hapusPesanan('${key}')">Hapus</button></td>
            </tr>`;
        });
      });
    };
    loadPesanan();

    window.tambahMeja = () => {
      const nama = document.getElementById("inputNamaMeja").value.trim();
      if (!nama) return alert("Isi nama meja!");
      const id = nama.toLowerCase().replace(/\s+/g, '');
      set(ref(db, "meja/" + id), { id, nama, status: "available" });
      document.getElementById("inputNamaMeja").value = "";
    };

    window.tambahMenu = () => {
      const nama = document.getElementById("inputNamaMenu").value.trim();
      const harga = parseInt(document.getElementById("inputHargaMenu").value);
      if (!nama ||!harga) return alert("Isi nama dan harga!");
      const id = "menu" + Date.now();
      set(ref(db, "menu/" + id), { id, nama, harga });
      document.getElementById("inputNamaMenu").value = "";
      document.getElementById("inputHargaMenu").value = "";
    };

    window.hapusMenu = (id) => {
      if (confirm("Hapus menu ini?")) remove(ref(db, "menu/" + id));
    };

    window.hapusMeja = (id) => {
      if (confirm("Hapus meja ini?")) {
        remove(ref(db, "meja/" + id));
        remove(ref(db, "pesanan_aktif/" + id));
      }
    };

    window.hapusPesanan = (key) => {
      if (confirm("Hapus pesanan ini?")) {
        remove(ref(db, "pesanan/" + key)).then(() => {
          alert("Pesanan dihapus");
          document.getElementById("billArea").innerHTML = "";
        });
      }
    };

    window.checkInMeja = (id) => {
      const namaPemesan = prompt("Masukkan nama pemesan:");
      if (!namaPemesan) return;
      const namaWaitress = prompt("Masukkan nama waitress:");
      if (!namaWaitress) return;

      update(ref(db, "meja/" + id), { status: "checked-in" });
      set(ref(db, "pesanan_aktif/" + id), {
        pemesan: namaPemesan,
        waitress: namaWaitress,
        items: [],
        subtotal: 0,
        ppn: 0,
        tax: 0,
        grandTotal: 0
      });

      document.getElementById("selectMeja").value = id;
      updateFormStatus();
    };

    window.checkOutMeja = (id) => {
      if (confirm("Yakin mau check-out meja ini?")) {
        update(ref(db, "meja/" + id), { status: "available" });
        remove(ref(db, "pesanan_aktif/" + id));
        updateFormStatus();
      }
    };

    function saveToFirebase(mejaId) {
      const pemesan = document.getElementById("inputPemesan").value.trim();
      const waitress = document.getElementById("inputWaitress").value.trim();
      const items = pesananSement[mejaId] || [];
      const subtotal = items.reduce((a, b) => a + b.subtotal, 0);
      const ppn = Math.round(subtotal * PPN_RATE);
      const tax = Math.round(subtotal * TAX_RATE);
      const grandTotal = subtotal + ppn + tax;

      set(ref(db, "pesanan_aktif/" + mejaId), {
        pemesan, waitress, items, subtotal, ppn, tax, grandTotal
      });
    }

    window.tambahPesanan = () => {
      const mejaId = document.getElementById("selectMeja").value;
      const menuId = document.getElementById("selectMenu").value;
      const qty = parseInt(document.getElementById("inputQty").value);
      const pemesan = document.getElementById("inputPemesan").value.trim();
      const waitress = document.getElementById("inputWaitress").value.trim();

      if (!mejaId || menuId === "" ||!pemesan ||!waitress)
        return alert("Lengkapi semua field!");

      const menu = menuList[menuId];
      if (!pesananSement[mejaId]) pesananSement[mejaId] = [];

      pesananSement[mejaId].push({ menuId, nama: menu.nama, harga: menu.harga, qty, subtotal: menu.harga * qty });

      document.getElementById("listPesanan").innerHTML = pesananSement[mejaId].map((p,i) =>
        `<p>${p.nama} x${p.qty} = Rp ${p.subtotal.toLocaleString()}
         <button class="btn-del" style="padding:2px 6px;" onclick="hapusItemPesanan(${i})">x</button></p>`
      ).join("");

      window.pesananAktifSement = { mejaId, pemesan, waitress, items: pesananSement[mejaId] };

      saveToFirebase(mejaId);
    };

    window.hapusItemPesanan = (index) => {
      const mejaId = document.getElementById("selectMeja").value;
      pesananSement[mejaId].splice(index, 1);
      document.getElementById("listPesanan").innerHTML = pesananSement[mejaId].map((p,i) =>
        `<p>${p.nama} x${p.qty} = Rp ${p.subtotal.toLocaleString()}
         <button class="btn-del" style="padding:2px 6px;" onclick="hapusItemPesanan(${i})">x</button></p>`
      ).join("");

      saveToFirebase(mejaId);
    };

    window.printBill = () => {
      if (!window.pesananAktifSement) return alert("Buat pesanan dulu!");

      const { mejaId, pemesan, waitress, items } = window.pesananAktifSement;
      const meja = document.querySelector(`#selectMeja option[value="${mejaId}"]`).text;
      const subtotal = items.reduce((a, b) => a + b.subtotal, 0);

      const ppn = Math.round(subtotal * PPN_RATE);
      const tax = Math.round(subtotal * TAX_RATE);
      const grandTotal = subtotal + ppn + tax;

      const waktu = new Date().toLocaleString("id-ID", {
        day: "2-digit", month: "2-digit", year: "numeric",
        hour: "2-digit", minute: "2-digit"
      });

      let rows = "";
      items.forEach((i, idx) => {
        rows += `
          <tr>
            <td>${idx + 1}</td>
            <td>${i.nama}</td>
            <td style="text-align:center;">${i.qty}</td>
            <td style="text-align:right;">${i.harga.toLocaleString()}</td>
            <td style="text-align:right;">${i.subtotal.toLocaleString()}</td>
          </tr>
        `;
      });

      const billHTML = `
        <div class="bill">
          <h3>KASIR NAOTAJUN</h3>
          <p>${waktu}</p>
          <div class="line"></div>
          <p style="text-align:left;"><b>Meja:</b> ${meja}</p>
          <p style="text-align:left;"><b>Pemesan:</b> ${pemesan}</p>
          <p style="text-align:left;"><b>Waitress:</b> ${waitress}</p>
          <div class="line"></div>

          <table>
            <thead>
              <tr>
                <th style="text-align:left;">No</th>
                <th style="text-align:left;">Menu</th>
                <th style="text-align:center;">Qty</th>
                <th style="text-align:right;">Harga</th>
                <th style="text-align:right;">Sub</th>
              </tr>
            </thead>
            <tbody>
              ${rows}
            </tbody>
          </table>

          <div class="line"></div>
          <table>
            <tr>
              <td style="text-align:right;">Subtotal</td>
              <td style="text-align:right; width:80px;">Rp ${subtotal.toLocaleString()}</td>
            </tr>
            <tr>
              <td style="text-align:right;">PPN 11%</td>
              <td style="text-align:right;">Rp ${ppn.toLocaleString()}</td>
            </tr>
            <tr>
              <td style="text-align:right;">Service 10%</td>
              <td style="text-align:right;">Rp ${tax.toLocaleString()}</td>
            </tr>
            <tr>
              <td style="text-align:right;"><b>GRAND TOTAL</b></td>
              <td style="text-align:right;"><b>Rp ${grandTotal.toLocaleString()}</b></td>
            </tr>
          </table>

          <div class="line"></div>
          <p>Waitress: ${waitress}</p>
          <p>Terima Kasih! 💖</p>
        </div>
      `;

      document.getElementById("billArea").innerHTML = billHTML;
      window.print();

      push(ref(db, "pesanan"), { mejaId, pemesan, waitress, items, subtotal, ppn, tax, grandTotal, waktu });

      pesananSement[mejaId] = [];
      document.getElementById("listPesanan").innerHTML = "";
      window.pesananAktifSement = null;
      updateFormStatus();
    };
  </script>
</body>
</html>
