<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check-in Meja</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 0;
      color: #333;
    }
    select, input, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      background: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #45a049;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Check-in Meja</h2>
    
    <label>Pilih Meja</label>
    <select id="mejaSelect">
      <option value="">-- Pilih Meja --</option>
      <option value="meja1">Meja 1</option>
      <option value="meja2">Meja 2</option>
      <option value="meja3">Meja 3</option>
    </select>

    <label>Kunci Reservasi</label>
    <input type="text" id="reservationKey" placeholder="Masukkan kunci reservasi">

    <button onclick="checkIn()">Check-in Meja</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // GANTI INI DENGAN CONFIG FIREBASE KAMU
    const firebaseConfig = {
      apiKey: "MASUKKAN_API_KEY",
      authDomain: "MASUKKAN_AUTH_DOMAIN",
      projectId: "MASUKKAN_PROJECT_ID",
      storageBucket: "MASUKKAN_STORAGE_BUCKET",
      messagingSenderId: "MASUKKAN_SENDER_ID",
      appId: "MASUKKAN_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.checkIn = async function() {
      const meja = document.getElementById("mejaSelect").value;
      const key = document.getElementById("reservationKey").value;

      if (!meja) {
        alert("Pilih meja dulu!");
        return;
      }

      if (!key) {
        alert("Masukkan kunci reservasi!");
        return;
      }

      try {
        const mejaRef = doc(db, "tables", meja);
        const mejaSnap = await getDoc(mejaRef);

        if (!mejaSnap.exists()) {
          alert("Meja tidak ditemukan di database!");
          return;
        }

        const data = mejaSnap.data();

        if (data.reservationKey !== key) {
          alert("Kunci reservasi salah!");
          return;
        }

        if (data.checked_in === true) {
          alert("Meja ini sudah check-in!");
          return;
        }

        await updateDoc(mejaRef, { checked_in: true });
        alert("Check-in berhasil!");
        
        // Reset form
        document.getElementById("mejaSelect").value = "";
        document.getElementById("reservationKey").value = "";

      } catch (error) {
        console.error("Error check-in:", error);
        alert("Gagal check-in: " + error.message);
      }
    }
  </script>
</body>
</html>
