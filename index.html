<!DOCTYPE html>
<html>
<head>
  <title>Kasir Naotajun2</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div id="loginPage">
  <h2>Login</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<div id="appPage" style="display:none;">
  <h2>Kasir Naotajun2</h2>
  <span id="roleBadge" style="background:#007bff; color:white; padding:4px 8px; border-radius:4px;">WAITRESS</span>
  <span id="userEmail"></span>
  <button onclick="logout()">Logout</button>

  <h3>1. Manajemen Meja & Check-in</h3>

  <!-- Ini bagian yang disembunyiin kalau bukan admin -->
  <div id="tambahMejaSection">
    <h4>Tambah Meja</h4>
    <input type="text" id="namaMeja" placeholder="Nama Meja, contoh: Meja 5">
    <button onclick="tambahMeja()">Tambah Meja</button>
  </div>

  <h4>Check-in Meja</h4>
  <select id="pilihMeja"></select>
  <input type="text" id="kunciReservasi" placeholder="Masukkan Kunci Reservasi">
  <button onclick="checkinMeja()">Check-in Meja</button>

  <h3>2. Input Order untuk</h3>
  <!-- bagian order kamu taruh di sini -->
</div>

<script>
// 1. Ganti config ini pakai punya kamu dari Firebase > Project Settings
const firebaseConfig = {
  apiKey: "xxx",
  authDomain: "xxx.firebaseapp.com",
  databaseURL: "https://xxx-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "xxx",
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// 2. Fungsi Login
function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  
  auth.signInWithEmailAndPassword(email, password)
    .catch(err => alert("Login gagal: " + err.message));
}

// 3. Fungsi Logout
function logout() {
  auth.signOut();
}

// 4. Cek status login dan role
auth.onAuthStateChanged(async (user) => {
  if (user) {
    // Ambil data role dari database
    const snap = await db.ref('users/' + user.uid).once('value');
    const userData = snap.val();
    
    if (!userData) {
      alert("Data user tidak ditemukan di database!");
      auth.signOut();
      return;
    }

    // Tampilkan halaman app
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('appPage').style.display = 'block';
    document.getElementById('userEmail').innerText = userData.email;
    document.getElementById('roleBadge').innerText = userData.role.toUpperCase();

    // Sembunyikan menu admin kalau role bukan admin
    if (userData.role !== 'admin') {
      document.getElementById('tambahMejaSection').style.display = 'none';
    }

    // Load data meja dll di sini
    loadMeja();

  } else {
    // Kalau belum login, tampilkan halaman login
    document.getElementById('loginPage').style.display = 'block';
    document.getElementById('appPage').style.display = 'none';
  }
});

// 5. Contoh fungsi tambah meja
function tambahMeja() {
  const nama = document.getElementById('namaMeja').value;
  db.ref('meja').push({
    nama: nama,
    status: 'aktif',
    dibuatOleh: auth.currentUser.email
  });
}

function loadMeja() {
  // isi fungsi buat load daftar meja ke dropdown
}

function checkinMeja() {
  // isi fungsi checkin
}
</script>

</body>
</html>
